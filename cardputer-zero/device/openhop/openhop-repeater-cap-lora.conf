[Service]
# Run the cap init (EXT 5V rail + GPIO26 power-enable + PI4IOE RF
# switch) before every openhop-repeater start — the SX1262 on the
# LoRa cap is unpowered and unswitched until this runs, and the
# repeater daemon knows nothing about the cap's bring-up. Same
# pattern (and same script) as the meshtasticd drop-in. The '+'
# prefix runs it with full privileges regardless of service user.
ExecStartPre=+/usr/local/sbin/cap-lora-init
